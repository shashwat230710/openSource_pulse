version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ../data/serving:/app/data/serving:ro
    environment:
      - SCORES_PATH=/app/data/serving/scores/*.parquet

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - api
